[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rusent"
version = "1.0.0"
description = "Read customer reviews in Roman Urdu and English and tell whether the feeling is positive, negative or neutral."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Awais Sabit"},
]
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
]

[project.scripts]
rusent = "rusent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
